# 本地验收：持久 H2 文件与独立 Redis DB，不修改现有 MySQL。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./runtime/course-v110;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,KEY,VALUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  sql:
    init:
      mode: never
  data:
    redis:
      database: 11
app:
  version: 1.1.0
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
logging:
  level:
    com.iflytek: INFO
